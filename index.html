           const vistaLista = document.getElementById('vista-lista');

    // Convierte el título en un enlace limpio
    function crearSlug(texto) {
        return texto.toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');
    }

    // Genera la URL exacta de una noticia
    function obtenerUrlNoticia(slug) {
        const urlBase = window.location.origin + window.location.pathname;
        return `${urlBase}?noticia=${slug}`;
    }

    // Abre la red social elegida o el menú nativo del móvil
    function ejecutarCompartir(red, titulo, url) {
        const texto = encodeURIComponent(titulo + " - Escuela Clan Lurueña: ");
        const enlace = encodeURIComponent(url);

        if (red === 'nativo') {
            if (navigator.share) {
                navigator.share({ title: titulo, text: titulo + " - Clan Lurueña", url: url }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url);
                alert('¡Enlace copiado al portapapeles! Ya puedes pegarlo donde quieras.');
            }
            return;
        }

        let urlFinal = "";
        if (red === 'whatsapp') urlFinal = `https://whatsapp.com{texto}${enlace}`;
        if (red === 'facebook') urlFinal = `https://facebook.com{enlace}`;
        if (red === 'twitter')  urlFinal = `https://twitter.com{texto}&url=${enlace}`;
        if (red === 'telegram') urlFinal = `https://t.me{enlace}&text=${texto}`;

        window.open(urlFinal, '_blank', 'noopener,noreferrer,width=600,height=450');
    }

    // Función para los botones de la cabecera principal
    function compartirPaginaPrincipal(red) {
        const urlPrincipal = window.location.origin + window.location.pathname;
        ejecutarCompartir(red, tituloOriginal, urlPrincipal);
    }

    // Función para los botones de cada noticia
    function compartirNoticiaPorIndice(red, index) {
        const n = noticias[index];
        const slug = crearSlug(n.titulo);
        const urlNoticia = obtenerUrlNoticia(slug);
        ejecutarCompartir(red, n.titulo, urlNoticia);
    }

    function cargarNoticias() {
        noticias.sort((a, b) => new Date(b.orden) - new Date(a.orden));
        vistaLista.innerHTML = '';
        noticias.forEach((noticia, index) => {
            const slug = crearSlug(noticia.titulo);
            vistaLista.innerHTML += `
                <div class="tarjeta">
                    <a href="?noticia=${slug}" class="tarjeta-enlace" onclick="event.preventDefault(); abrirNoticia(${index}, true);">
                        <img src="${noticia.portada}" alt="${noticia.titulo}">
                        <h2>${noticia.titulo}</h2>
                    </a>
                    <div class="barra-compartir">
                        ${generarHtmlBotonesNoticia(index)}
                    </div>
                </div>
            `;
        });
    }

    function abrirNoticia(index, actualizarUrl = true) {
        const n = noticias[index];
        const slug = crearSlug(n.titulo);

        document.getElementById('detalle-titulo').innerText = n.titulo;
        document.getElementById('detalle-compartir').innerHTML = generarHtmlBotonesNoticia(index);
        
        const parrafos = n.texto.trim().split('\n').filter(p => p.trim() !== '');
        document.getElementById('detalle-texto').innerHTML = parrafos.map(p => `<p>${p}</p>`).join('');
        document.getElementById('detalle-fotos').innerHTML = n.fotos.map(foto => `<img src="${foto}" alt="${n.titulo}">`).join('');
        
        document.title = n.titulo + " | Clan Lurueña";

        if (actualizarUrl) {
            window.history.pushState({ noticiaIndex: index }, n.titulo, `?noticia=${slug}`);
        }

        vistaLista.style.display = 'none';
        vistaDetalle.style.display = 'block';
        window.scrollTo(0, 0);
    }

    function cerrarNoticia(actualizarUrl = true) {
        vistaDetalle.style.display = 'none';
        vistaLista.style.display = 'grid';
        document.title = tituloOriginal;

        if (actualizarUrl) {
            window.history.pushState({}, tituloOriginal, window.location.pathname);
        }
    }

    // Detecta si alguien entra desde un enlace compartido (?noticia=...) o usa el botón Atrás del navegador
    function comprobarUrlInicial() {
        const params = new URLSearchParams(window.location.search);
        const slugUrl = params.get('noticia');
        if (slugUrl) {
            const indexEncontrado = noticias.findIndex(n => crearSlug(n.titulo) === slugUrl);
            if (indexEncontrado !== -1) {
                abrirNoticia(indexEncontrado, false);
                return;
            }
        }
        cerrarNoticia(false);
    }

    window.addEventListener('popstate', comprobarUrlInicial);

    // Iniciar la página
    cargarNoticias();
    comprobarUrlInicial();
</script>
