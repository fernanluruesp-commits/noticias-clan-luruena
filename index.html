    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #333; }
        header { background-color: #111; color: #fff; text-align: center; padding: 30px 15px; border-bottom: 5px solid #c0392b; }
        header h1 { margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .contenedor { max-width: 1000px; margin: 30px auto; padding: 0 15px; }
        .lista-noticias { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .tarjeta { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
        .tarjeta:hover { transform: translateY(-5px); }
        .tarjeta img { width: 100%; height: 220px; object-fit: cover; display: block; }
        .tarjeta h2 { font-size: 1.25rem; margin: 15px; color: #111; }
        #vista-detalle { display: none; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn-volver { background: #c0392b; color: #fff; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 5px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
        .btn-volver:hover { background: #a93226; }
        #detalle-titulo { font-size: 1.8rem; margin-top: 0; margin-bottom: 20px; color: #111; }
        #detalle-texto p { line-height: 1.7; font-size: 1.05rem; margin-bottom: 15px; }
        .galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 25px; }
        .galeria img { width: 100%; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

</header>

    <div id="vista-lista" class="lista-noticias"></div>

    const vistaLista = document.getElementById('vista-lista');
    const vistaDetalle = document.getElementById('vista-detalle');

    function cargarNoticias() {
        noticias.sort((a, b) => new Date(b.orden) - new Date(a.orden));
        vistaLista.innerHTML = '';
        noticias.forEach((noticia, index) => {
            vistaLista.innerHTML += `
                <div class="tarjeta" onclick="abrirNoticia(${index})">
                    <img src="${noticia.portada}" alt="${noticia.titulo}">
                    <h2>${noticia.titulo}</h2>
                </div>
            `;
        });
    }

    function abrirNoticia(index) {
        const n = noticias[index];
        document.getElementById('detalle-titulo').innerText = n.titulo;
        const parrafos = n.texto.trim().split('\n').filter(p => p.trim() !== '');
        document.getElementById('detalle-texto').innerHTML = parrafos.map(p => `<p>${p}</p>`).join('');
        document.getElementById('detalle-fotos').innerHTML = n.fotos.map(foto => `<img src="${foto}" alt="Foto del campeonato">`).join('');
        vistaLista.style.display = 'none';
        vistaDetalle.style.display = 'block';
        window.scrollTo(0, 0);
    }

    function cerrarNoticia() {
        vistaDetalle.style.display = 'none';
        vistaLista.style.display = 'grid';
    }

    cargarNoticias();
